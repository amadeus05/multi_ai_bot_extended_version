services:
  paper-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: light-paper-web
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      RENDER_DISK_PATH: /data
    volumes:
      - ./render-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/uptime', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
